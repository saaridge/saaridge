# Egress is blocked inside the container via iptables (network-lock.sh),
# allowing only host.docker.internal:7331 (MCP/Data API), :7332 (HTTP proxy),
# and :7333 (framed FS IPC for FUSE).
#
# Host project data is NOT bind-mounted. Container apps use /host (FUSE → Data API).
# Docker Desktop: requires /dev/fuse; SYS_ADMIN is needed for FUSE mounts.

services:
  agent-box:
    build:
      context: .
      dockerfile: container/Dockerfile
    image: agent-bridge-box:local
    container_name: agent-bridge-box
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-runtime:/opt/agents
      - browser-home:/home/browser
    ports:
      - "6081:6080"
      - "6082:6082"
    environment:
      BRIDGE_URL: http://host.docker.internal:7331
      BRIDGE_PORT: "7331"
      BRIDGE_PROXY_PORT: "7332"
      BRIDGE_FS_PORT: "7333"
      HOSTFS_IPC_PORT: "7333"
      BRIDGE_HOST: host.docker.internal
      BROWSER: /opt/bridge/bridge-browser.sh
      DISPLAY: ":1"
      RESOLUTION: 1920x1080x24
      HOSTFS_MOUNT: /host
    shm_size: "1gb"
    devices:
      - /dev/fuse
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /tmp:size=512m,mode=1777
    restart: unless-stopped

volumes:
  agent-runtime:
  browser-home:
