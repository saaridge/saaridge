<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:3847;"
    />
    <title>Allow home write</title>
    <style>
      :root {
        --line: #24302b;
        --text: #e7f0eb;
        --muted: #8fa79b;
        --accent: #3dba8a;
        --panel: #151f1b;
        --danger: #d96b6b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--panel);
        color: var(--text);
        font: 500 13px/1.4 system-ui, -apple-system, sans-serif;
      }
      .dlg {
        padding: 1.15rem;
        display: grid;
        gap: 0.75rem;
      }
      h3 { margin: 0; font-size: 1.05rem; }
      p { margin: 0; color: var(--muted); font-size: 0.82rem; }
      code {
        font-size: 0.75rem;
        color: var(--text);
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.35rem;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 8px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #042015;
        border-color: transparent;
        font-weight: 600;
      }
      button.danger {
        border-color: #5a3030;
        color: #f0c4c4;
      }
      .status { font-size: 0.78rem; color: var(--muted); min-height: 1.1em; }
      .warn {
        border: 1px solid #4a3a20;
        background: #1c1810;
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
        color: #e6d3a0;
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <div class="dlg">
      <h3>Allow write to host home?</h3>
      <p>
        Assistant <strong id="agentName">—</strong> tried to save a file under your
        Mac home folder. Host home is read-only until you approve.
      </p>
      <p>Path: <code id="deniedPath">—</code></p>
      <div class="warn">
        This is a OneBridge host-user grant — not container sudo. Do not approve
        Cursor’s “Retry as Sudo”. You can revoke anytime in the control plane.
      </div>
      <div class="row">
        <button type="button" id="denyBtn" class="danger">Deny</button>
        <button type="button" id="allowBtn" class="primary">Allow home write</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <script src="./host-home-consent.js"></script>
  </body>
</html>
