<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:3847 http://127.0.0.1:6081 ws://127.0.0.1:6081 ws://127.0.0.1:6082;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneBridge</title>
    <style>
      :root {
        --bar: #121a17;
        --line: #24302b;
        --text: #e7f0eb;
        --muted: #8fa79b;
        --accent: #3dba8a;
        --accent-deep: #1f7a58;
        --track: #1c2923;
        --panel: #151f1b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b100e;
        color: var(--text);
        font: 500 13px/1.3 system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-rows: 44px 1fr;
      }
      .titlebar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.75rem;
        padding: 0 12px 0 78px;
        background: linear-gradient(180deg, #16201c, var(--bar));
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        justify-self: start;
        min-width: 0;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(145deg, var(--accent), var(--accent-deep));
        flex-shrink: 0;
      }
      .brand span { font-weight: 600; }
      .os-badge {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        border: 1px solid rgba(61, 186, 138, 0.22);
        background: rgba(61, 186, 138, 0.08);
        color: var(--muted);
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.02em;
        white-space: nowrap;
        -webkit-app-region: no-drag;
        cursor: default;
      }
      .os-badge[hidden] { display: none; }
      .os-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.85;
        flex-shrink: 0;
      }
      .actions {
        display: flex;
        gap: 0.4rem;
        justify-self: end;
        -webkit-app-region: no-drag;
      }
      .actions button {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 8px;
        padding: 0.35rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .actions button:hover { border-color: var(--accent); }
      .actions button:disabled {
        opacity: 0.35;
        cursor: default;
        pointer-events: none;
      }
      .actions.locked button {
        opacity: 0.35;
        pointer-events: none;
      }
      .stage {
        position: relative;
        background: #000;
        min-height: 0;
      }
      /* Desktop is rendered in an Electron BrowserView (keyboard-safe). */
      .stage iframe { display: none !important; }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.85rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, #163028 0%, transparent 55%),
          #0b100e;
        z-index: 5;
        text-align: center;
        padding: 2rem;
      }
      #boot.hidden { display: none; }
      #boot h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
      #boot p { margin: 0; color: var(--muted); max-width: 360px; }
      .progress-wrap {
        width: min(360px, 78vw);
        margin: 0.35rem auto 0;
      }
      .progress-track {
        height: 8px;
        border-radius: 999px;
        background: var(--track);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-deep), var(--accent));
        transition: width 0.35s ease;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 0.45rem;
        font-size: 11px;
        color: var(--muted);
      }
      #boot.err .progress-fill { background: #a84848; }
      #boot.err p { color: #e07070; }

      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        color: var(--text);
        padding: 0;
        width: min(440px, calc(100% - 2rem));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      dialog::backdrop { background: rgba(4, 10, 8, 0.72); }
      .dlg {
        padding: 1.15rem;
        display: grid;
        gap: 0.7rem;
        -webkit-app-region: no-drag;
      }
      .dlg h3 { margin: 0; font-size: 1.05rem; }
      .dlg > p { margin: 0; color: var(--muted); font-size: 0.82rem; }
      .dlg label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .dlg input, .dlg select {
        border: 1px solid var(--line);
        background: #0b100e;
        color: var(--text);
        border-radius: 10px;
        padding: 0.55rem 0.7rem;
        font: inherit;
        outline: none;
      }
      .dlg input:focus, .dlg select:focus { border-color: var(--accent); }
      .provider-info {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(10, 16, 14, 0.55);
        padding: 0.7rem 0.8rem;
        display: grid;
        gap: 0.35rem;
      }
      .provider-info .name {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text);
      }
      .provider-info .desc {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.4;
      }
      .provider-info .hint {
        font-size: 0.76rem;
        color: var(--accent);
      }
      .provider-info a {
        color: var(--accent);
        font-size: 0.76rem;
        text-decoration: none;
      }
      .provider-info a:hover { text-decoration: underline; }
      .dlg-actions { display: flex; gap: 0.45rem; justify-content: flex-end; margin-top: 0.2rem; }
      .dlg .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 10px;
        padding: 0.5rem 0.85rem;
        font: inherit;
        cursor: pointer;
      }
      .dlg .btn-primary {
        background: linear-gradient(180deg, var(--accent), var(--accent-deep));
        border-color: transparent;
        color: #04150e;
        font-weight: 600;
      }
      .dlg .status {
        font-size: 0.78rem;
        color: var(--muted);
        min-height: 1.1em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <span>OneBridge</span>
        </div>
        <div class="os-badge" id="osBadge" title="Sandbox desktop OS" hidden>
          <span class="dot" aria-hidden="true"></span>
          <span id="osLabel">Linux</span>
        </div>
        <div class="actions locked" id="uiActions">
          <button type="button" id="btnApiKey" disabled>API key</button>
        </div>
      </header>
      <div class="stage">
        <div id="boot">
          <h1>Starting workspace</h1>
          <p id="bootMsg">Preparing…</p>
          <div class="progress-wrap" aria-label="Startup progress">
            <div class="progress-track">
              <div class="progress-fill" id="bootBar"></div>
            </div>
            <div class="progress-meta">
              <span id="bootPhase">idle</span>
              <span id="bootPct">0%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <dialog id="keyDlg">
      <form class="dlg" id="keyForm">
        <h3>Bridge LLM</h3>
        <p>Optional. Pick a provider, then paste its API key. The key stays in memory only — never saved to disk.</p>
        <label>
          Provider
          <select id="providerSelect" aria-describedby="providerInfo"></select>
        </label>
        <div class="provider-info" id="providerInfo" aria-live="polite">
          <div class="name" id="providerName">Select a provider</div>
          <div class="desc" id="providerDesc"></div>
          <div class="hint" id="providerHint"></div>
          <a id="providerDocs" href="#" target="_blank" rel="noreferrer" hidden>Get an API key</a>
        </div>
        <label>
          Model
          <select id="modelSelect"></select>
        </label>
        <label id="apiKeyLabel">
          API key
          <input id="apiKeyInput" type="password" placeholder="" autocomplete="off" />
        </label>
        <div class="status" id="keyStatus"></div>
        <div class="dlg-actions">
          <button class="btn" type="button" id="keyCancel">Cancel</button>
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="./shell.js"></script>
  </body>
</html>
