<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:3847;"
    />
    <title>API key</title>
    <style>
      :root {
        --line: #24302b;
        --text: #e7f0eb;
        --muted: #8fa79b;
        --accent: #3dba8a;
        --panel: #151f1b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--panel);
        color: var(--text);
        font: 500 13px/1.35 system-ui, -apple-system, sans-serif;
      }
      .dlg {
        padding: 1.15rem;
        display: grid;
        gap: 0.7rem;
      }
      h3 { margin: 0; font-size: 1.05rem; }
      p { margin: 0; color: var(--muted); font-size: 0.82rem; }
      label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.78rem;
        color: var(--muted);
      }
      input, select {
        border: 1px solid var(--line);
        background: #0b100e;
        color: var(--text);
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.35rem;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 8px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #042015;
        border-color: transparent;
        font-weight: 600;
      }
      .status { font-size: 0.78rem; color: var(--muted); min-height: 1.1em; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <form class="dlg" id="keyForm">
      <h3>Bridge LLM</h3>
      <p>Optional. Pick a provider, then paste its API key. The key stays in memory only.</p>
      <label>
        Provider
        <select id="providerSelect"></select>
      </label>
      <div>
        <strong id="providerName"></strong>
        <p id="providerDesc"></p>
        <p id="providerHint"></p>
        <a id="providerDocs" href="#" target="_blank" rel="noreferrer" hidden>Get an API key</a>
      </div>
      <label>
        Model
        <select id="modelSelect"></select>
      </label>
      <label id="apiKeyLabel">
        API key
        <input id="apiKeyInput" type="password" autocomplete="off" />
      </label>
      <div class="status" id="keyStatus"></div>
      <div class="row">
        <button type="button" id="keyCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
    <script src="apikey.js"></script>
  </body>
</html>
