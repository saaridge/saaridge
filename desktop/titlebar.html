<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:3847;"
    />
    <title>OneBridge Titlebar</title>
    <style>
      :root {
        --bar: #121a17;
        --line: #24302b;
        --text: #e7f0eb;
        --muted: #8fa79b;
        --accent: #3dba8a;
        --accent-deep: #1f7a58;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #16201c, var(--bar));
        color: var(--text);
        font: 500 13px/1.3 system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.75rem;
        padding: 0 12px 0 78px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        justify-self: start;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(145deg, var(--accent), var(--accent-deep));
      }
      .os-badge {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        border: 1px solid rgba(61, 186, 138, 0.22);
        background: rgba(61, 186, 138, 0.08);
        color: var(--muted);
        font-size: 11px;
        -webkit-app-region: no-drag;
      }
      .os-badge[hidden] { display: none; }
      .os-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .actions {
        display: flex;
        gap: 0.4rem;
        justify-self: end;
        -webkit-app-region: no-drag;
      }
      .actions button {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 8px;
        padding: 0.35rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .actions button:hover { border-color: var(--accent); }
      .actions button:disabled {
        opacity: 0.35;
        cursor: default;
        pointer-events: none;
      }
      .actions.locked button {
        opacity: 0.35;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <span>OneBridge</span>
      </div>
      <div class="os-badge" id="osBadge" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="osLabel">Linux</span>
      </div>
      <div class="actions locked" id="uiActions">
        <button type="button" id="btnApiKey" disabled>API key</button>
      </div>
    </div>
    <script src="titlebar.js"></script>
  </body>
</html>
