<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:3847;"
    />
    <title>OneBridge Titlebar</title>
    <style>
      :root {
        --bar: #121a17;
        --line: #24302b;
        --text: #e7f0eb;
        --muted: #8fa79b;
        --accent: #3dba8a;
        --accent-deep: #1f7a58;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #16201c, var(--bar));
        color: var(--text);
        font: 500 13px/1.3 system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0 10px 0 78px;
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        flex: 0 1 auto;
        overflow: hidden;
      }
      .brand span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(145deg, var(--accent), var(--accent-deep));
        flex-shrink: 0;
      }
      .os-badge {
        flex: 1 1 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        border: 1px solid rgba(61, 186, 138, 0.22);
        background: rgba(61, 186, 138, 0.08);
        color: var(--muted);
        font-size: 11px;
        min-width: 0;
        max-width: 220px;
        margin: 0 auto;
        -webkit-app-region: no-drag;
        cursor: default;
      }
      .os-badge[hidden] { display: none; }
      .os-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
      }
      .os-badge #osLabel {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex: 0 0 auto;
        margin-left: auto;
        -webkit-app-region: no-drag;
        position: relative;
        z-index: 10;
      }
      .actions button {
        appearance: none;
        border: 1px solid var(--line);
        background: #1a2420;
        color: var(--text);
        border-radius: 8px;
        padding: 0.32rem 0.65rem;
        font: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        flex-shrink: 0;
        min-height: 28px;
      }
      .actions button:hover { border-color: var(--accent); }
      .actions button:disabled {
        opacity: 0.35;
        cursor: default;
        pointer-events: none;
      }
      .actions.locked button {
        opacity: 0.35;
        pointer-events: none;
      }
      .actions button svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }
      @media (max-width: 520px) {
        .titlebar { padding-left: 12px; }
        .brand span { display: none; }
        .os-badge { display: none !important; }
        .actions button .label { display: none; }
        .actions button { padding: 0.32rem 0.45rem; }
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <span>OneBridge</span>
      </div>
      <div class="os-badge" id="osBadge" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="osLabel">Linux</span>
      </div>
      <div class="actions locked" id="uiActions">
        <button type="button" id="btnSettings" disabled title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span class="label">Settings</span>
        </button>
      </div>
    </div>
    <script src="titlebar.js"></script>
  </body>
</html>
