<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Desktop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b0b0b;
      touch-action: none;
    }
    #screen {
      position: absolute;
      /* Electron titlebar BrowserView overlays the top; keep the VNC pane
         below it so remote FB size matches the visible clickable area. */
      top: var(--onebridge-titlebar, 44px);
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      overflow: hidden;
      background: #0b0b0b;
      touch-action: none;
    }
    /* noVNC owns canvas sizing — never stretch/crop via CSS. */
    #screen canvas {
      display: block;
    }
  </style>
  <script type="module" crossorigin="anonymous">
    import RFB from "./core/rfb.js";

    let rfb;
    let accY = 0;
    let accX = 0;

    const screen = document.getElementById("screen");

    // Sync titlebar inset with Electron shell (?titlebar=44).
    (() => {
      const q = Number(new URLSearchParams(location.search).get("titlebar"));
      const px = Number.isFinite(q) && q >= 0 ? q : 44;
      document.documentElement.style.setProperty("--onebridge-titlebar", `${px}px`);
    })();

    /**
     * Electron main process forwards keys here (before-input-event → RFB.sendKey).
     * Direct sendKey — more reliable than DOM KeyboardEvent (often untrusted/empty).
     */
    window.__onebridgeKey = (payload) => {
      try {
        const r = window.__onebridgeRfb;
        if (!r || r._rfbConnectionState !== "connected" || r._viewOnly) {
          return false;
        }
        if (typeof r.sendKey !== "function") return false;

        const NAMED = {
          Enter: 0xff0d,
          Return: 0xff0d,
          Backspace: 0xff08,
          Tab: 0xff09,
          Escape: 0xff1b,
          Esc: 0xff1b,
          Delete: 0xffff,
          Home: 0xff50,
          ArrowLeft: 0xff51,
          ArrowUp: 0xff52,
          ArrowRight: 0xff53,
          ArrowDown: 0xff54,
          PageUp: 0xff55,
          PageDown: 0xff56,
          End: 0xff57,
          Insert: 0xff63,
          " ": 0x0020,
          Spacebar: 0x0020,
          Shift: 0xffe1,
          Control: 0xffe3,
          Alt: 0xffe9,
          Meta: 0xffeb,
          F1: 0xffbe,
          F2: 0xffbf,
          F3: 0xffc0,
          F4: 0xffc1,
          F5: 0xffc2,
          F6: 0xffc3,
          F7: 0xffc4,
          F8: 0xffc5,
          F9: 0xffc6,
          F10: 0xffc7,
          F11: 0xffc8,
          F12: 0xffc9,
        };

        const key = String(payload.key || "");
        const code = String(payload.code || "") || undefined;
        let keysym = NAMED[key];

        if (keysym == null && key.length === 1) {
          // Latin-1 / BMP printable (covers letters, digits, punctuation).
          keysym = key.charCodeAt(0);
        }
        if (keysym == null && code.startsWith("Digit") && code.length === 6) {
          keysym = code.charCodeAt(5); // Digit5 → '5'
        }
        if (keysym == null) return false;

        r.sendKey(keysym, code, !!payload.down);
        return true;
      } catch (_) {
        return false;
      }
    };

    /* ---------------- Audio ---------------- */
    let audioCtx = null;
    let audioWs = null;
    let nextPlayTime = 0;
    let audioRate = 48000;
    let audioChannels = 2;
    let audioArmed = false;

    const ensureAudioContext = async () => {
      if (!audioCtx) audioCtx = new AudioContext({ sampleRate: audioRate });
      if (audioCtx.state === "suspended") await audioCtx.resume();
      audioArmed = true;
    };

    const playPcmChunk = (arrayBuffer) => {
      if (!arrayBuffer) return;
      // Auto-arm when PCM arrives if the context is already created/resumed.
      if (audioCtx && audioCtx.state === "running") audioArmed = true;
      if (!audioCtx || !audioArmed) return;
      const int16 = new Int16Array(arrayBuffer);
      if (!int16.length) return;
      const frames = Math.floor(int16.length / audioChannels);
      if (frames <= 0) return;
      const buffer = audioCtx.createBuffer(audioChannels, frames, audioRate);
      for (let ch = 0; ch < audioChannels; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = 0; i < frames; i++) {
          data[i] = int16[i * audioChannels + ch] / 32768;
        }
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (nextPlayTime < now + 0.02) nextPlayTime = now + 0.02;
      src.start(nextPlayTime);
      nextPlayTime += buffer.duration;
      if (nextPlayTime - now > 0.75) nextPlayTime = now + 0.05;
    };

    const connectAudio = () => {
      if (audioWs && (audioWs.readyState === WebSocket.OPEN || audioWs.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const host = location.hostname || "127.0.0.1";
      try {
        audioWs = new WebSocket(`${proto}://${host}:6082/`);
      } catch (_) {
        return;
      }
      audioWs.binaryType = "arraybuffer";
      audioWs.onmessage = (ev) => {
        let data = ev.data;
        if (typeof data === "string") {
          try {
            const msg = JSON.parse(data);
            if (msg.type === "hello") {
              audioRate = msg.rate || 48000;
              audioChannels = msg.channels || 2;
            }
          } catch (_) {}
          return;
        }
        // Some embeds deliver text frames as ArrayBuffer when binaryType=arraybuffer.
        if (data instanceof ArrayBuffer && data.byteLength < 256) {
          try {
            const text = new TextDecoder().decode(data);
            if (text.startsWith("{")) {
              const msg = JSON.parse(text);
              if (msg.type === "hello") {
                audioRate = msg.rate || 48000;
                audioChannels = msg.channels || 2;
                return;
              }
            }
          } catch (_) {}
        }
        playPcmChunk(data);
      };
      audioWs.onclose = () => setTimeout(connectAudio, 1500);
      audioWs.onerror = () => {};
    };

    /* ---------------- Scroll: real VNC wheel buttons (4/5/6/7) ---------------- */
    // Arrow-key scrolling was unreliable (stuck modifiers / Chromium ignores
    // arrow keys for page scroll). Use noVNC's pointer button masks instead.
    const WHEEL_STEP = 40;
    const WHEEL_LINE = 19;

    const clientToCanvas = (clientX, clientY) => {
      const canvas = rfb && rfb._canvas;
      if (!canvas) return { x: 0, y: 0 };
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return { x: 0, y: 0 };
      const x = ((clientX - rect.left) / rect.width) * canvas.width;
      const y = ((clientY - rect.top) / rect.height) * canvas.height;
      return {
        x: Math.max(0, Math.min(canvas.width - 1, x)),
        y: Math.max(0, Math.min(canvas.height - 1, y)),
      };
    };

    const clickWheelButton = (x, y, bmask) => {
      if (typeof rfb._handleMouseButton === "function") {
        rfb._handleMouseButton(x, y, true, bmask);
        rfb._handleMouseButton(x, y, false, bmask);
      }
    };

    const onWheel = (ev) => {
      if (!rfb || rfb._rfbConnectionState !== "connected") return;
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();

      try { rfb.focus(); } catch (_) {}

      let dX = ev.deltaX;
      let dY = ev.deltaY;
      if (ev.deltaMode !== 0) {
        dX *= WHEEL_LINE;
        dY *= WHEEL_LINE;
      }

      accX += dX;
      accY += dY;
      const { x, y } = clientToCanvas(ev.clientX, ev.clientY);

      let steps = 0;
      while (Math.abs(accY) >= WHEEL_STEP) {
        // noVNC: button4 = 1<<3 (up), button5 = 1<<4 (down)
        clickWheelButton(x, y, accY < 0 ? (1 << 3) : (1 << 4));
        accY += accY < 0 ? WHEEL_STEP : -WHEEL_STEP;
        steps += 1;
        if (steps > 40) { accY = 0; break; }
      }
      while (Math.abs(accX) >= WHEEL_STEP) {
        // button6 = 1<<5 (left), button7 = 1<<6 (right)
        clickWheelButton(x, y, accX < 0 ? (1 << 5) : (1 << 6));
        accX += accX < 0 ? WHEEL_STEP : -WHEEL_STEP;
        steps += 1;
        if (steps > 40) { accX = 0; break; }
      }
    };

    const armWheel = () => {
      const canvas = rfb && rfb._canvas;
      if (canvas && rfb._eventHandlers?.handleWheel) {
        canvas.removeEventListener("wheel", rfb._eventHandlers.handleWheel);
      }
      for (const el of [screen, canvas, document].filter(Boolean)) {
        el.removeEventListener("wheel", onWheel, true);
        el.addEventListener("wheel", onWheel, { passive: false, capture: true });
      }
    };

    /**
     * Keep remote FB == viewer pane for true 1:1 clicks via native noVNC mouse.
     * Do NOT inject mouse via xdotool — that fights x11vnc's pointer ownership.
     */
    let lastResizeKey = "";
    let resizeInFlight = false;
    let resizeTimer = 0;

    const viewerSize = () => {
      let w = Math.floor(screen.clientWidth || 0);
      let h = Math.floor(screen.clientHeight || 0);
      // Fall back only if screen not laid out yet
      if (w < 100) w = Math.floor(window.innerWidth || 1280);
      if (h < 100) h = Math.floor(window.innerHeight || 800);
      w = Math.max(800, w - (w % 2));
      h = Math.max(600, h - (h % 2));
      return { w, h };
    };

    const applyScaleMode = () => {
      if (!rfb) return;
      const { w, h } = viewerSize();
      const fbW = Number(rfb._fbWidth || 0);
      const fbH = Number(rfb._fbHeight || 0);
      const matched = fbW > 0 && fbH > 0 && fbW === w && fbH === h;
      // Pixel-perfect when matched; otherwise scale-to-fit (still clickable).
      rfb.scaleViewport = !matched;
      rfb.clipViewport = false;
      rfb.dragViewport = false;
      if (typeof rfb._updateScale === "function") {
        try {
          rfb._updateScale();
        } catch (_) {}
      }
    };

    const syncDesktopToViewer = () => {
      if (!rfb || rfb._rfbConnectionState !== "connected") return;
      const { w, h } = viewerSize();
      const key = `${w}x${h}`;
      const fbW = Number(rfb._fbWidth || 0);
      const fbH = Number(rfb._fbHeight || 0);
      if (fbW === w && fbH === h) {
        lastResizeKey = key;
        applyScaleMode();
        return;
      }
      if (key === lastResizeKey && resizeInFlight) return;
      applyScaleMode();
      if (resizeInFlight) return;
      resizeInFlight = true;
      fetch("http://127.0.0.1:3847/api/ui/resize-desktop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ width: w, height: h }),
      })
        .then((r) => r.json().catch(() => ({})))
        .then((j) => {
          if (j && j.ok) lastResizeKey = key;
          applyScaleMode();
        })
        .catch(() => {})
        .finally(() => {
          resizeInFlight = false;
        });
    };

    const scheduleSync = (ms = 120) => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(syncDesktopToViewer, ms);
    };

    function connect() {
      if (rfb) {
        try { rfb.disconnect(); } catch (_) {}
        rfb = null;
      }
      accX = 0;
      accY = 0;
      lastResizeKey = "";

      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const path = new URLSearchParams(window.location.search).get("path") || "websockify";
      const url = `${protocol}://${window.location.host}/${path}`;

      rfb = new RFB(screen, url);
      window.__onebridgeRfb = rfb;

      // Native noVNC mouse — required (x11vnc owns the X pointer).
      rfb.scaleViewport = false;
      rfb.resizeSession = false;
      rfb.clipViewport = false;
      rfb.dragViewport = false;
      rfb.focusOnClick = true;
      rfb.viewOnly = false;
      rfb.qualityLevel = 8;
      rfb.compressionLevel = 2;
      rfb.showDotCursor = true;

      const grabKeyboardLocal = () => {
        try { screen.focus({ preventScroll: true }); } catch (_) { screen.focus(); }
        try { window.focus(); } catch (_) {}
        if (rfb) {
          try {
            if (rfb._canvas) rfb._canvas.tabIndex = 0;
            if (rfb._keyboard) {
              try { rfb._keyboard.ungrab(); } catch (_) {}
              rfb._keyboard._target = window;
              rfb._keyboard.grab();
            }
            rfb.focus();
          } catch (_) {}
        }
      };

      rfb.addEventListener("connect", () => {
        try {
          if (rfb._canvas) rfb._canvas.tabIndex = 0;
        } catch (_) {}
        grabKeyboardLocal();
        armWheel();
        scheduleSync(50);
        setTimeout(armWheel, 100);
        setTimeout(() => scheduleSync(0), 350);
        setTimeout(grabKeyboardLocal, 200);
        connectAudio();
      });
      rfb.addEventListener("desktopresize", () => {
        // Do not clear lastResizeKey / force another resize — that fought
        // Electron's parallel resize and flipped scaleViewport every frame.
        applyScaleMode();
        const { w, h } = viewerSize();
        const fbW = Number(rfb._fbWidth || 0);
        const fbH = Number(rfb._fbHeight || 0);
        if (fbW === w && fbH === h) {
          lastResizeKey = `${w}x${h}`;
        } else {
          scheduleSync(200);
        }
        setTimeout(grabKeyboardLocal, 60);
      });
      rfb.addEventListener("disconnect", (e) => {
        if (!e.detail.clean) setTimeout(connect, 800);
      });
      rfb.addEventListener("credentialsrequired", () => {
        rfb.sendCredentials({ password: "" });
      });
    }

    window.addEventListener("resize", () => scheduleSync(150));
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => scheduleSync(150)).observe(screen);
    }
    // Safety net: if FB and pane drift, heal occasionally (not every 2s —
    // frequent resizes break double-click text selection).
    setInterval(() => scheduleSync(0), 8000);

    const armAudioOnGesture = () => {
      void ensureAudioContext();
      connectAudio();
    };
    const grabKeyboard = () => {
      try { screen.focus({ preventScroll: true }); } catch (_) { screen.focus(); }
      try { window.focus(); } catch (_) {}
      if (!rfb) return;
      try {
        if (rfb._canvas) {
          rfb._canvas.tabIndex = 0;
        }
        // noVNC Keyboard must listen on window so Electron key events reach it.
        if (rfb._keyboard) {
          try { rfb._keyboard.ungrab(); } catch (_) {}
          rfb._keyboard._target = window;
          try { rfb._keyboard.grab(); } catch (_) {}
        }
        if (typeof rfb.focus === "function") rfb.focus();
      } catch (_) {}
    };
    screen.addEventListener("pointerdown", () => {
      grabKeyboard();
      armAudioOnGesture();
    });
    screen.addEventListener("pointerup", () => {
      grabKeyboard();
    });
    // Ensure first key after focus still reaches noVNC.
    window.addEventListener(
      "keydown",
      (ev) => {
        armAudioOnGesture();
        if (!rfb) return;
        const active = document.activeElement;
        if (active !== rfb._canvas && active !== screen && active !== document.body) {
          grabKeyboard();
        }
      },
      true,
    );
    window.addEventListener("focus", grabKeyboard);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) grabKeyboard();
    });

    connect();
    connectAudio();
  </script>
</head>
<body>
  <div id="screen" tabindex="0"></div>
</body>
</html>
