[runtime]
runs_dir = "runs"
timeout_seconds = 300
max_input_bytes = 2000000

[detectors]
require_classifier = true
classifier_model_path = "/absolute/path/to/digest-pinned/privacy-filter"
classifier_model_digest = "64-character-directory-digest"
classifier_timeout_seconds = 10
max_workers = 4
# Optional compact, non-generative detector for low-latency edge deployments.
# Set require_classifier=false when using this path.
edge_model_path = "/absolute/path/to/edge-detector.json"
edge_model_digest = "64-character-file-sha256"
edge_model_required = false
edge_model_threshold = 0.80

[policy]
version = "poc-en-v1"
unknown_high_risk_action = "BLOCK"

[codex]
executable = "codex"
required_version = "0.131.0"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
base_url = "https://llm-gateway.example.test/v1"
allowed_gateway_hosts = ["llm-gateway.example.test"]
