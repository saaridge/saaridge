[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-codex"
version = "0.2.0"
description = "English-only, local privacy wrapper and evaluator for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "privacy-codex contributors" }]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
detectors = [
  "detect-secrets>=1.5",
  "phonenumbers>=8.13",
  "regex>=2024.5",
]
ml = [
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "torch>=2.3",
  "transformers>=4.43",
]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
privacy-codex = "privacy_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
